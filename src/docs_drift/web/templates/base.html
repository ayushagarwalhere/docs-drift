<!doctype html>
<html lang="en" data-theme="dark" data-motion="off">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Find stale documentation. Inspect the exact line, source evidence and available Git history. Try docs-drift without an account or API key.">
  <meta name="theme-color" content="#181818">
  <title>{% block title %}docs-drift — Code moves. Docs drift.{% endblock %}</title>
  <link rel="preload" href="/static/fonts/InstrumentSerif-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/report.css">
  <link rel="stylesheet" href="/static/demo.css">
  <link rel="stylesheet" href="/static/site.css">
  <script src="/static/demo.js" defer></script>
  <script src="/static/site.js" defer></script>
  {% block scripts %}{% endblock %}
</head>
<body class="app-body dd-inner">
  {% include '_chrome.html' %}
  <a class="skip" href="#main">Skip to content</a>
  {% include '_nav.html' %}
  {% block content %}{% endblock %}
  {% include '_footer.html' %}
</body>
</html>
