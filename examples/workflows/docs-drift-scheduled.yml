# Weekly scan of the default branch that keeps one docs-drift tracking issue up to date.
# It is closed automatically when drift reaches zero and reopened if drift returns.
# Replace <reviewed-commit-sha> with a reviewed commit of ayushagarwalhere/docs-drift.
name: Documentation drift report

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: docs-drift-scheduled
  cancel-in-progress: false

jobs:
  docs-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5 # pin to a reviewed commit SHA
        with:
          python-version: '3.12'
      - id: drift
        uses: ayushagarwalhere/docs-drift@<reviewed-commit-sha>
        with:
          mode: issue
          issue-label: docs-drift
          fail-on-drift: 'false'
      - if: always() && steps.drift.outputs.report-directory != ''
        uses: actions/upload-artifact@v4 # pin to a reviewed commit SHA
        with:
          name: docs-drift-report
          path: ${{ steps.drift.outputs.report-directory }}
          retention-days: 30
