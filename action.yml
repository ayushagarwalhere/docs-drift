name: docs-drift
description: Scan repository documentation with static source evidence; no target code execution or model calls.
inputs:
  repo:
    description: Repository subdirectory under the checked-out workspace.
    default: .
  fail-on-drift:
    description: Fail the step on findings at default confidence.
    default: 'true'
  baseline:
    description: Optional reviewed baseline JSON path relative to repo. Missing or invalid files fail the action.
    default: ''
  base-ref:
    description: Optional fetched base commit/ref for new or changed PR drift comparisons. Fetch full history.
    default: ''
  reviews:
    description: Optional source-scoped review JSON path relative to repo.
    default: ''
  min-confidence:
    description: Optional confidence threshold from 0 to 1; defaults to repository configuration.
    default: ''
  max-findings:
    description: Allowed number of qualifying new drift findings before the gate fails.
    default: '0'
  mode:
    description: >-
      check (gate and artifacts only), pr-review (sticky PR comment and inline suggestions),
      issue (one tracking issue for scheduled scans) or auto (pr-review on pull requests,
      issue on schedule/workflow_dispatch).
    default: check
  comment:
    description: Shortcut for mode auto when mode is check. Requires pull-requests/issues write permission.
    default: 'false'
  github-token:
    description: Token for publishing; only the publish step receives it, never the scan step.
    default: ${{ github.token }}
  issue-label:
    description: Label that identifies the docs-drift tracking issue in issue mode.
    default: docs-drift
  check-run:
    description: In pr-review mode also create a docs-drift Check Run (needs checks write).
    default: 'false'
  suggestions:
    description: Attach GitHub suggested changes to inline comments when the fix is a certain line edit.
    default: 'true'
outputs:
  report-directory:
    description: Runner-local HTML, JSON, SARIF and Markdown report directory.
    value: ${{ steps.scan.outputs.report-directory }}
  gate-status:
    description: passed, failed or report_only. A pass is not proof of documentation correctness.
    value: ${{ steps.scan.outputs.gate-status }}
  new-drift:
    description: New drift count before confidence filtering.
    value: ${{ steps.scan.outputs.new-drift }}
  qualifying-new-drift:
    description: New drift findings at or above the gate confidence threshold.
    value: ${{ steps.scan.outputs.qualifying-new-drift }}
  baseline-drift:
    description: Existing drift accepted by the selected baseline; retained in full reports.
    value: ${{ steps.scan.outputs.baseline-drift }}
  bundle-path:
    description: Runner-local JSON bundle of publishable findings consumed by the publish step.
    value: ${{ steps.scan.outputs.bundle-path }}
runs:
  using: composite
  steps:
    - name: Install trusted action source in an isolated environment
      shell: bash
      env:
        ACTION_SOURCE: ${{ github.action_path }}
      run: |
        python -m venv "$RUNNER_TEMP/docs-drift-action"
        "$RUNNER_TEMP/docs-drift-action/bin/python" -m pip install "$ACTION_SOURCE[github]"
    - id: scan
      shell: bash
      env:
        SCAN_REPO: ${{ inputs.repo }}
        FAIL_ON_DRIFT: ${{ inputs.fail-on-drift }}
        SCAN_BASE_REF: ${{ inputs.base-ref }}
        SCAN_REVIEWS: ${{ inputs.reviews }}
        SCAN_BASELINE: ${{ inputs.baseline }}
        SCAN_MIN_CONFIDENCE: ${{ inputs.min-confidence }}
        SCAN_MAX_FINDINGS: ${{ inputs.max-findings }}
        ACTION_SOURCE: ${{ github.action_path }}
      run: '"$RUNNER_TEMP/docs-drift-action/bin/python" "$ACTION_SOURCE/scripts/action_runner.py"'
    - id: publish
      if: ${{ always() && steps.scan.outputs.bundle-path != '' && (inputs.mode != 'check' || inputs.comment == 'true') }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        DOCS_DRIFT_MODE: ${{ inputs.mode }}
        DOCS_DRIFT_COMMENT: ${{ inputs.comment }}
        DOCS_DRIFT_BUNDLE: ${{ steps.scan.outputs.bundle-path }}
        DOCS_DRIFT_ISSUE_LABEL: ${{ inputs.issue-label }}
        DOCS_DRIFT_CHECK_RUN: ${{ inputs.check-run }}
        DOCS_DRIFT_SUGGESTIONS: ${{ inputs.suggestions }}
        ACTION_SOURCE: ${{ github.action_path }}
      working-directory: ${{ github.workspace }}
      run: '"$RUNNER_TEMP/docs-drift-action/bin/python" "$ACTION_SOURCE/scripts/action_publish.py"'
