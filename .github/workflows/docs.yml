name: Documentation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.11'
      - run: uv sync --locked --all-extras
      - run: uv run pytest tests/test_hardening.py tests/test_benchmark.py
      - run: uv run mkdocs build --strict
      - run: uv run docs-drift check --repo . --no-color
  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DOCS_DRIFT_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.11'
      - run: uv sync --locked --all-extras
      - run: uv run mkdocs gh-deploy --force
