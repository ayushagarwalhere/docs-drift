name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    env:
      # Keep the extras installed by sync available to every uv run step.
      UV_ALL_EXTRAS: "true"
      UV_LOCKED: "true"
      DOCS_DRIFT_LLM_MODE: "replay"
      DOCS_DRIFT_DIST: "dist"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src scripts tests benchmark
      - run: uv run deptry .
      - run: uv run pip-audit --skip-editable
      - run: uv build
      - run: uv run pytest --cov=docs_drift --cov=scripts --cov-report=term-missing --cov-report=json:.docs-drift/coverage.json
      - run: uv run python -m scripts.check_coverage
      - run: uv run pre-commit run --all-files

  release-container:
    name: release container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
      - run: uv build --wheel
      - name: Build and verify the release image before publishing
        run: |
          docker build -f Dockerfile.release -t docs-drift-release-check .
          EXPECTED_VERSION=$(uv run docs-drift --version)
          ACTUAL_VERSION=$(docker run --rm docs-drift-release-check --version)
          echo "Container version: $ACTUAL_VERSION"
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION"

  dogfood:
    name: dogfood
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run docs-drift check --repo . --no-color
