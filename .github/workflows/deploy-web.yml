name: Deploy web
# Ships main to the EC2 Docker host after CI passes, over SSH.
# Setup: docs/deploy.md ("Automatic deploys").
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to deploy (defaults to the latest main)
        required: false
permissions:
  contents: read
concurrency:
  group: production-web
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      vars.DOCS_DRIFT_DEPLOY_ENABLED == 'true' &&
      vars.DOCS_DRIFT_DEPLOY_FREEZE != 'true' &&
      (github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_SHA: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_USER: ${{ vars.EC2_USER }}
      EC2_APP_DIR: ${{ vars.EC2_APP_DIR }}
      BASE_URL: ${{ vars.DOCS_DRIFT_BASE_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Redeploy on the host
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "DEPLOY_SHA='$DEPLOY_SHA' bash '${EC2_APP_DIR:-/opt/docs-drift}/deploy/ec2/redeploy.sh'"
      - name: Verify the public site serves this commit
        run: |
          body=$(curl -fsS --max-time 20 "$BASE_URL/healthz")
          echo "$body"
          case "$body" in *"$DEPLOY_SHA"*) ;; *) echo "healthz does not report $DEPLOY_SHA" >&2; exit 1 ;; esac
          python3 scripts/smoke.py "$BASE_URL"
      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
