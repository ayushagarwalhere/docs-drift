name: Monitor judging demo
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: demo-monitor
  cancel-in-progress: false
jobs:
  health:
    if: vars.DOCS_DRIFT_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check service and example twice before alerting
        env:
          BASE_URL: ${{ vars.DOCS_DRIFT_BASE_URL }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scripts/monitor_web.py
