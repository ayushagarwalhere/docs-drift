name: Monitor judging demo
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: demo-monitor
  cancel-in-progress: false
jobs:
  health:
    if: vars.DOCS_DRIFT_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check service and example twice before alerting
        env:
          BASE_URL: ${{ vars.DOCS_DRIFT_BASE_URL }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scripts/monitor_web.py
