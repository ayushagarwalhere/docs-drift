name: History secrets
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks 8.30.1
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Recompute allowlisted generated hashes in current files and history
        run: python scripts/verify_group_keys.py --history
      - name: Scan all fetched history with redacted output
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts=--all --config .gitleaks.toml --redact --no-banner'
